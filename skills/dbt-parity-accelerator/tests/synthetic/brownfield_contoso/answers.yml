# Interview answers for Contoso (brownfield): adopt everything that exists, add QA as a new
# environment branch, rename non-DBT_ env vars, reuse the existing EAI and dbt object name.
git: {provider: github, repo: contoso/edw-analytics, ci_auth: oidc}
dbt:
  object_name: CONTOSO_ANALYTICS
  object_schema: DBT
  extra_env_vars:
    DBT_ERP_DATABASE: {default: RAW_ERP}
warehouse: {name: TRANSFORM_WH, adopt: true}
environments:
  - {name: dev, branch: develop, target: dev, env_yml_env: dev, hosts_ci: true,
     role: {name: EDW_DEV_ENGINEER, adopt: true}}
  - {name: qa, branch: release, target: qa, env_yml_env: qa, hosts_ci: true,
     role: {name: EDW_QA_ENGINEER, adopt: true}}
  - {name: prod, branch: main, target: prod, env_yml_env: prod,
     role: {name: EDW_PROD_ENGINEER, adopt: true}, read_role: {name: ANALYST, adopt: true}}
ci: {enabled: true, role: EDW_DBT_CI, schema: DBT_CI, env_yml_env: ci, pr_schema_prefix: PR_}
sources:
  - {database: RAW_ERP, schemas: [SAP]}
packages: {needs_eai: true, eai_name: DBT_HUB_EAI}
schedule: {enabled: true, environment: prod, cron: "0 5 * * * UTC"}
